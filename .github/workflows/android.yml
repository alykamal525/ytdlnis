name: Build LOKA APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      - name: Create signing key
        run: |
          PW=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$GITHUB_WORKSPACE/app/loka.jks" -alias loka -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Loka Downloader"
          touch local.properties
          {
            echo "signingConfig.storeFile=loka.jks"
            echo "signingConfig.storePassword=$PW"
            echo "signingConfig.keyAlias=loka"
            echo "signingConfig.keyPassword=$PW"
          } > keystore.properties
          chmod +x gradlew

      - name: Build
        run: ./gradlew assembleGithubRelease --warning-mode all

      - name: Rename APKs
        run: |
          cd app/build/outputs/apk/github/release
          for f in YTDLnis-*.apk; do
            for abi in arm64-v8a armeabi-v7a x86_64 x86 universal; do
              case "$f" in *"-$abi-"*) mv "$f" "LOKA-DOWNLOADER-$abi.apk"; break;; esac
            done
          done
          ls -la

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: loka-downloader-apk
          path: app/build/outputs/apk/github/release/LOKA-DOWNLOADER-*.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: loka-yt-${{ github.run_number }}
          name: LOKA DOWNLOADER build ${{ github.run_number }}
          files: app/build/outputs/apk/github/release/LOKA-DOWNLOADER-*.apk
